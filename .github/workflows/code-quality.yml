name: Linting and code quality

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  linting:
    name: Code-quality checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toxenv:
          - ruff
          - docs

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install tox tox-uv

      - run: tox
        env:
          TOXENV: ${{ matrix.toxenv }}
          FORCE_COLOR: "1"
